# Только production: web слушает loopback за системным Nginx с очищенными заголовками.
map $http_x_real_ip $trusted_client_ip { default $http_x_real_ip; "" $remote_addr; }
map $http_x_forwarded_proto $trusted_scheme { default $scheme; https https; }
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $trusted_scheme;
        proxy_set_header X-Real-IP $trusted_client_ip;
        # Игнорируем присланный извне X-Forwarded-For для ограничения по настоящему клиенту.
        proxy_set_header X-Forwarded-For $trusted_client_ip;
    }
    location = /health {
        proxy_pass http://api:8000/health;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
