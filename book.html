<!DOCTYPE html>
<!-- ^ Объявление HTML5. Первая строка файла. -->

<!-- ==========================================================================
     ЛР №2 — адаптивная вёрстка и дизайн-токены.

     Структура HTML не изменена: теги, их порядок, вложенность и содержимое
     остались такими же, как в ЛР №1. Единственное дополнение — атрибут class
     у части тегов. Это разрешено заданием ЛР №2: «не изменяя структуру HTML,
     допускается только добавление классов».

     Классы здесь отличаются от index.html только в блоках страницы:
     вместо .catalog и .book-card используется .book (одна книга)
     и .review (для каждого отзыва).
     ========================================================================== -->

<html lang="ru">
<!-- ^ Корневой элемент. lang="ru" — язык страницы: русский. -->

<head>
  <meta charset="UTF-8">
  <!-- ^ Кодировка UTF-8. Без неё русский текст может отобразиться кракозябрами. -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ^ Адаптивность. Требование задания — ставить на каждой странице. -->

  <title>Книга — BookNest</title>
  <!-- ^ Заголовок вкладки. Уникален для этой страницы. -->

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
</head>

<body>

  <header class="site-header">
    <!-- ^ site-header — БЭМ-блок: шапка сайта. Одинакова для всех страниц. -->

    <h1 class="site-header__title">BookNest</h1>
    <!-- ^ site-header__title — элемент блока: название клуба. -->

    <p class="site-header__tagline">Книжный клуб университета</p>

    <nav class="site-nav">
      <!-- ^ site-nav — блок: основное меню. -->
      <ul class="site-nav__list">
        <li class="site-nav__item"><a class="site-nav__link" href="index.html">Каталог</a></li>
        <li class="site-nav__item"><a class="site-nav__link" href="book.html" aria-current="page">Книга</a></li>
        <!-- ^ aria-current="page" — подсказка скринридерам, что это текущая страница. -->
        <li class="site-nav__item"><a class="site-nav__link" href="loan.html">Выдача</a></li>
        <li class="site-nav__item"><a class="site-nav__link" href="profile.html">Профиль</a></li>
      </ul>
    </nav>
  </header>

  <main class="page">

    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <ol class="breadcrumbs__list">
        <li class="breadcrumbs__item"><a class="breadcrumbs__link" href="index.html">Каталог</a></li>
        <li class="breadcrumbs__item" aria-current="page">Книга</li>
      </ol>
    </nav>

    <div class="state" id="details-loading" hidden>
      <p class="state__text">Загрузка…</p>
    </div>

    <div class="state state--error" id="details-error" hidden>
      <p class="state__text" id="details-error-text"></p>
      <button class="btn btn--ghost" type="button" id="details-error-retry">Повторить</button>
    </div>

    <article class="book" id="details-content" hidden>
      <!-- Данные заполнит js/pages/book.js -->
    </article>

  </main>

  <footer class="site-footer">
    <p class="site-footer__copy">© 2026 BookNest — книжный клуб университета</p>
    <address class="site-footer__contacts">
      <a class="site-footer__link" href="mailto:booknest@university.ru">booknest@university.ru</a>
    </address>
  </footer>
    <script type="module" src="js/main.js"></script>
   <script type="module" src="js/pages/book.js"></script>

</body>
</html>
