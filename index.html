<!DOCTYPE html>
<!-- Объявление HTML5. -->

<!-- ==========================================================================
     ЛР №4 — интеграция с внешним REST API Open Library.

     Что реализовано:

     1. Поиск книг через Open Library API.
     2. Debounce 350 мс.
     3. Минимальная длина запроса — 3 символа.
     4. Четыре состояния:
          loading
          success
          empty
          error
     5. Кнопка «Повторить» при ошибке.
     6. Отмена устаревших запросов через AbortController.
     7. Накопительная загрузка через кнопку «Показать ещё».
     8. Wishlist хранится в localStorage.
     9. Экспорт и импорт wishlist через JSON.
     ========================================================================== -->

<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Каталог книг — BookNest</title>

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
</head>

<body>

  <header class="site-header">

    <h1 class="site-header__title">
      BookNest
    </h1>

    <p class="site-header__tagline">
      Книжный клуб университета
    </p>

    <nav class="site-nav">
      <ul class="site-nav__list">

        <li class="site-nav__item">
          <a
            class="site-nav__link"
            href="index.html"
            aria-current="page"
          >
            Каталог
          </a>
        </li>

        <li class="site-nav__item">
          <a
            class="site-nav__link"
            href="book.html"
          >
            Книга
          </a>
        </li>

        <li class="site-nav__item">
          <a
            class="site-nav__link"
            href="loan.html"
          >
            Выдача
          </a>
        </li>

        <li class="site-nav__item">
          <a
            class="site-nav__link"
            href="profile.html"
          >
            Профиль
          </a>
        </li>

      </ul>
    </nav>

    <!-- ================================================================
         Wishlist + экспорт / импорт.
         ================================================================ -->

    <div class="site-header__actions">

      <span
        class="site-header__wishlist"
        id="wishlist-count"
      >
        Мой список: 0
      </span>

      <button
        class="btn btn--ghost"
        type="button"
        id="export"
      >
        Экспорт
      </button>

      <label
        class="btn btn--ghost"
        for="import"
      >
        Импорт

        <input
          class="site-header__file"
          type="file"
          id="import"
          accept=".json,application/json"
          hidden
        >
      </label>

    </div>

  </header>

  <main class="page">

    <h2 class="page__title">
      Каталог книг
    </h2>

    <!-- ================================================================
         ПОИСК.
         ================================================================ -->

    <form
      class="filter"
      id="filters"
      role="search"
    >

      <fieldset class="filter__group">

        <legend class="filter__legend">
          Поиск книг
        </legend>

        <label
          class="filter__label"
          for="search"
        >
          Введите название или автора
          (минимум 3 символа)
        </label>

        <input
          class="filter__input"
          type="search"
          id="search"
          placeholder="Например, Tolkien"
          autocomplete="off"
        >

      </fieldset>

    </form>

    <!-- Количество уже загруженных книг. -->
    <p
      class="catalog__counter"
      id="counter"
    ></p>

    <!-- ================================================================
         СОСТОЯНИЕ LOADING.

         Показывается во время первого запроса.
         ================================================================ -->

    <div
      class="state"
      id="state-loading"
      hidden
    >
      <p class="state__text">
        Загрузка…
      </p>
    </div>

    <!-- ================================================================
         СОСТОЯНИЕ EMPTY.

         Показывается:
         - если введено меньше 3 символов;
         - если API не нашёл книги.
         ================================================================ -->

    <div
      class="state"
      id="state-empty"
      hidden
    >
      <p class="state__text">
        Ничего не найдено.
        Введите минимум 3 символа
        и попробуйте другой запрос.
      </p>
    </div>

    <!-- ================================================================
         СОСТОЯНИЕ ERROR.

         Текст ошибки заполняется из main.js.

         Ошибки различаются:
         - нет сети;
         - 4xx;
         - 5xx.
         ================================================================ -->

    <div
      class="state state--error"
      id="state-error"
      hidden
    >

      <p
        class="state__text"
        id="state-error-text"
      ></p>

      <button
        class="btn btn--ghost"
        type="button"
        id="state-error-retry"
      >
        Повторить
      </button>

    </div>

    <!-- ================================================================
         СОСТОЯНИЕ SUCCESS.

         Здесь отображаются результаты поиска.

         При первом запросе загружается 20 книг.

         После нажатия «Показать ещё»:
         - запрашивается следующая страница API;
         - новые книги добавляются к уже загруженным;
         - старые книги не исчезают.
         ================================================================ -->

    <section
      class="catalog"
      id="state-success"
      hidden
    >

      <!-- Список книг заполняется через renderSearchResults(). -->
      <ul
        class="catalog__list"
        id="book-list"
      ></ul>

      <!-- ==============================================================
           НАКОПИТЕЛЬНАЯ ЗАГРУЗКА.

           Эта кнопка заменяет старую пагинацию
           «Назад / Вперёд».

           main.js сам:
           - показывает кнопку;
           - блокирует её во время запроса;
           - скрывает на последней странице.
           ============================================================== -->

      <div class="pagination">

        <button
          class="btn btn--ghost"
          type="button"
          id="load-more"
          hidden
        >
          Показать ещё
        </button>

      </div>

    </section>

  </main>

  <footer class="site-footer">

    <p class="site-footer__copy">
      © 2026 BookNest — книжный клуб университета
    </p>

    <address class="site-footer__contacts">

      <a
        class="site-footer__link"
        href="mailto:booknest@university.ru"
      >
        booknest@university.ru
      </a>

    </address>

  </footer>

  <!-- Главный JS-модуль приложения. -->
  <script
    type="module"
    src="js/main.js"
  ></script>

</body>

</html>
