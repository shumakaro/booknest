<!DOCTYPE html>
<!-- ^ Объявление HTML5. Первая строка файла. -->

<!-- ==========================================================================
     ЛР №3 — JavaScript-приложение: каталог с фильтрами.

     Что изменилось по сравнению с ЛР №2 (структура HTML впервые меняется,
     это разрешено заданием третьей лабы):

     1. Секция каталога: шесть статичных <article> удалены. Вместо них
        пустой <ul id="book-list">, который наполняет JavaScript из модуля
        js/ui/render.js.

     2. Форма фильтров: получила id="filters". Полям добавлены id (search,
        genre, sort, available), чтобы JavaScript мог их найти и слушать
        изменения. Появилась кнопка сброса id="reset".

     3. Шапка: добавлен счётчик «Мой список: N» (id="wishlist-count"),
        кнопки «Экспорт» (id="export") и «Импорт» (id="import").

     4. В конце body подключён модуль main.js через
        <script type="module" src="js/main.js"></script>.

     Стили, классы БЭМ, тёмная тема, адаптивность — всё осталось из ЛР №2.
     Добавились только новые элементы под JavaScript.
     ========================================================================== -->

<html lang="ru">
<!-- ^ Корневой элемент. lang="ru" — язык страницы: русский. -->

<head>
  <meta charset="UTF-8">
  <!-- ^ Кодировка UTF-8. Универсальная, поддерживает кириллицу. -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ^ Адаптивность. Требование задания — ставить на каждой странице. -->

  <title>Каталог книг — BookNest</title>
  <!-- ^ Заголовок вкладки. Уникален для этой страницы. -->

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
</head>

<body>

  <header class="site-header">
    <!-- ^ site-header — БЭМ-блок: шапка сайта. -->

    <h1 class="site-header__title">BookNest</h1>
    <p class="site-header__tagline">Книжный клуб университета</p>

    <nav class="site-nav">
      <ul class="site-nav__list">
        <li class="site-nav__item"><a class="site-nav__link" href="index.html" aria-current="page">Каталог</a></li>
        <li class="site-nav__item"><a class="site-nav__link" href="book.html">Книга</a></li>
        <li class="site-nav__item"><a class="site-nav__link" href="loan.html">Выдача</a></li>
        <li class="site-nav__item"><a class="site-nav__link" href="profile.html">Профиль</a></li>
      </ul>
    </nav>

    <div class="site-header__actions">
      <!-- ^ site-header__actions — блок управления в шапке.
           Добавлен в ЛР №3 под JavaScript-приложение. -->

      <span class="site-header__wishlist" id="wishlist-count">Мой список: 0</span>
      <!-- ^ Счётчик книг в списке желаемого. Обновляет renderWishlistCount
           из ui/render.js. id="wishlist-count" — на него ссылается main.js. -->

      <button class="btn btn--ghost" type="button" id="export">Экспорт</button>
      <!-- ^ Кнопка экспорта списка желаемого в JSON (доп. задание). -->

      <label class="btn btn--ghost" for="import">
        <!-- ^ Кнопка импорта — это label для скрытого input[type=file].
             Так выглядит как кнопка, а внутри работает нативный file input. -->
        Импорт
        <input class="site-header__file" type="file" id="import" accept=".json,application/json" hidden>
        <!-- ^ Скрытый input для выбора JSON-файла. hidden — чтобы не показывать
             стандартный браузерный вид, а стилизовать через label. -->
      </label>
    </div>
  </header>

  <main class="page">

    <h2 class="page__title">Каталог книг</h2>

    <form class="filter" id="filters" role="search">
      <!-- ^ Форма фильтров. id="filters" — на него вешает слушатель main.js.
           role="search" — подсказка для скринридеров.
           Атрибуты action и method убраны: форма теперь чисто клиентская,
           она не отправляется на сервер, поэтому preventDefault не нужен,
           но мы всё равно его делаем на всякий случай. -->

      <fieldset class="filter__group">
        <legend class="filter__legend">Фильтры</legend>

        <label class="filter__label" for="search">Поиск по названию или автору</label>
        <input class="filter__input" type="search" id="search" placeholder="Например, Тартт" value="">
        <!-- ^ Поле поиска. id="search" — на него ссылается main.js.
             value="" — пустое по умолчанию, восстановится из localStorage. -->

        <label class="filter__label" for="genre">Жанр</label>
        <select class="filter__select" id="genre">
          <!-- ^ Выпадающий список жанров. Значения value — на английском
               (совпадают с полем genre в data/books.js). Подписи — на русском. -->
          <option value="all">Все жанры</option>
          <option value="roman">Роман</option>
          <option value="scifi">Фантастика</option>
          <option value="detective">Детектив</option>
          <option value="fantasy">Фэнтези</option>
          <option value="nonfiction">Нон-фикшн</option>
        </select>

        <label class="filter__label" for="sort">Сортировка</label>
        <select class="filter__select" id="sort">
          <option value="title">По названию (А–Я)</option>
          <option value="year">По году (новые сначала)</option>
          <option value="rating">По рейтингу</option>
        </select>

        <input class="filter__checkbox" type="checkbox" id="available">
        <!-- ^ Чекбокс «только доступные». id="available" — на него смотрит main.js.
             Атрибут name убран: форма не отправляется на сервер, name не нужен. -->

        <label class="filter__label filter__label--checkbox" for="available">Только доступные</label>

        <button class="btn" type="submit">Применить фильтры</button>
        <!-- ^ Кнопка оставлена для полноты формы, но фактически фильтрация
             происходит мгновенно при вводе. Кнопка нужна как страховка
             для пользователей, которые ожидают submit. -->

        <button class="btn btn--ghost" type="button" id="reset">Сбросить</button>
        <!-- ^ Кнопка сброса фильтров (доп. функционал из требований).
             type="button" — важно, иначе она попытается отправить форму. -->
      </fieldset>
    </form>

    <p class="catalog__counter" id="counter">Найдено: 0 книг</p>
    <!-- ^ Счётчик найденных книг. Обновляет renderCounter из ui/render.js. -->

    <section class="catalog">
      <ul class="catalog__list" id="book-list">
        <!-- ^ Пустой контейнер для карточек. Заполняет JavaScript.
             Раньше здесь были шесть статичных <article> из ЛР №1 и №2,
             теперь их создаёт renderBooks из ui/render.js по данным
             из data/books.js. Каждая книга превращается в <li class="book-card">. -->
      </ul>
    </section>

  </main>

  <footer class="site-footer">
    <p class="site-footer__copy">© 2026 BookNest — книжный клуб университета</p>
    <address class="site-footer__contacts">
      <a class="site-footer__link" href="mailto:booknest@university.ru">booknest@university.ru</a>
    </address>
  </footer>

  <script type="module" src="js/main.js"></script>
  <!-- ^ Подключение главного модуля. type="module" обязателен для ESM:
       только с ним работают import/export. Скрипт в конце body — чтобы
       DOM был построен к моменту его выполнения. Если бы поставили
       в head, document.querySelector вернул бы null. -->

</body>
</html>
