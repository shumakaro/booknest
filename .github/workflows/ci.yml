name: BookNest checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Новая версия того же PR заменяет его старый прогон, не отменяя другие PR.
concurrency:
  group: booknest-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: booknest
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booknest"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/booknest
      TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/booknest_test
      CORS_ORIGINS: '["http://localhost:5173"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - name: Prepare isolated test configuration
        shell: bash
        run: |
          python - <<'PY'
          import os, secrets
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SECRET_KEY=' + secrets.token_hex(32) + '\n')
          PY
          pip install -r requirements-lock.txt
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://postgres@127.0.0.1:5432/postgres', autocommit=True) as db:
              db.execute('CREATE DATABASE booknest_test')
          PY
      - run: python -m ruff check app tests migrations examples
      - name: Check maintained verification tools
        run: python -m ruff check tools/check_container_http.py tools/generate_api_types.py tools/measure_orm.py tools/check_orm_metadata.py tools/prepare_container_check.py
      - name: Verify current API types without rewriting files
        run: python tools/generate_api_types.py --check
      - run: python -m pytest -q --cov=app --cov-report=term-missing --junitxml=artifacts/backend-tests.xml
      - run: npm --prefix react-app ci
      - run: npm --prefix react-app run lint
      - run: npm --prefix react-app run test -- --maxWorkers=2
      - run: npm --prefix react-app run build
      - name: Save backend test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests
          path: artifacts/backend-tests.xml
          retention-days: 7
          if-no-files-found: ignore
  containers:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: booknest-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate disposable container configuration
        run: python tools/prepare_container_check.py --output .env --port 8080
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait
      - name: Build and smoke the unified Render image
        run: |
          docker build -f docker/render.Dockerfile -t booknest-render:ci .
          python - <<'PY'
          import json, pathlib, subprocess, time, urllib.request
          # Используется только временная БД runner; Neon и production-секретов здесь нет.
          config = dict(line.split('=', 1) for line in pathlib.Path('.env').read_text().splitlines())
          db = subprocess.check_output(['docker', 'compose', 'ps', '-q', 'db'], text=True).strip()
          metadata = json.loads(subprocess.check_output(['docker', 'inspect', db], text=True))[0]
          network, = metadata['NetworkSettings']['Networks']
          url = 'postgresql+psycopg://booknest:' + config['POSTGRES_PASSWORD'] + '@db:5432/booknest'
          pathlib.Path('.tools').mkdir(exist_ok=True)
          pathlib.Path('.tools/render-ci.env').write_text('DATABASE_URL=' + url + '\nSECRET_KEY=' + config['SECRET_KEY'] + '\nCORS_ORIGINS=["http://127.0.0.1:8090"]\nCOOKIE_SECURE=false\n')
          subprocess.run(['docker', 'run', '-d', '--name', 'booknest-render-ci', '--network', network,
                          '--env-file', '.tools/render-ci.env', '-p', '127.0.0.1:8090:10000', 'booknest-render:ci'], check=True)
          for attempt in range(25):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=1).close()
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError('Render image failed to start')
          PY
          BOOKNEST_CHECK_IMMUTABLE=1 BOOKNEST_CHECK_GZIP=1 BOOKNEST_CHECK_BASE_URL=http://127.0.0.1:8090 python tools/check_container_http.py
      - name: Smoke and persistence without deleting volumes
        run: |
          BOOKNEST_CHECK_IMMUTABLE=1 python tools/check_container_http.py
          docker compose down
          docker compose up -d --wait
          BOOKNEST_CHECK_IMMUTABLE=1 python tools/check_container_http.py
          docker compose ps
          docker image ls booknest-api:local
          docker image ls booknest-web:local
          python tools/check_image_sizes.py
          docker run --rm --entrypoint python booknest-api:local -c "import os; from pathlib import Path; assert os.geteuid() != 0; assert not Path('/app/tests').exists(); assert not Path('/app/docs').exists(); print('Runtime API: non-root, no tests or documentation')"
      - name: Verify backup and restore into a new database
        run: |
          COMPOSE_ENV_FILE=.env BACKUP_DIR=.tools/backups sh deployment/backup.sh
          dump=$(find .tools/backups -name '*.dump' -type f | head -n 1)
          COMPOSE_ENV_FILE=.env sh deployment/restore.sh "$dump" booknest_ci_restore_test
          if COMPOSE_ENV_FILE=.env sh deployment/restore.sh "$dump" booknest_ci_restore_test; then
            echo "Restore must refuse an existing database"
            exit 1
          fi
      - name: Browser scenario inside clean container environment
        run: |
          mkdir -p .tools
          docker compose exec -T api cat .tools/demo-accounts.json > .tools/demo-accounts.json
          npm --prefix react-app ci
          cd react-app
          npx playwright install --with-deps chromium
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:8090 npm run test:e2e
      - name: Verify trusted proxy rate limit
        run: |
          docker compose restart api
          docker compose up -d --wait
          python tools/check_proxy_rate.py
      - name: Test profile with independent database
        run: docker compose --profile test up --build --abort-on-container-exit --exit-code-from test test
      - name: Collect isolated container test report
        if: always()
        run: |
          mkdir -p artifacts
          if [ -n "$(docker compose ps -aq test)" ]; then
            docker compose cp test:/app/.tools/container-tests.xml artifacts/container-tests.xml || true
          fi
      - name: Save container test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-tests
          path: artifacts/container-tests.xml
          retention-days: 7
          if-no-files-found: ignore
      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=150 db api seed web
          docker logs --tail=100 booknest-render-ci || true
      - name: Stop only this disposable runner project
        if: always()
        run: |
          docker rm -f booknest-render-ci || true
          docker compose --profile test down
