# Применяется поверх базового Compose только на сервере с внешним TLS Nginx.
services:
  api:
    environment:
      COOKIE_SECURE: 'true'
      CORS_ORIGINS: '["https://${DOMAIN:?set DOMAIN}"]'
  seed:
    environment:
      COOKIE_SECURE: 'true'
      CORS_ORIGINS: '["https://${DOMAIN:?set DOMAIN}"]'
  web:
    volumes:
      - ./deployment/nginx-container-trusted.conf:/etc/nginx/conf.d/default.conf:ro
    ports: !override
      - '127.0.0.1:${WEB_PORT:-8080}:80'
